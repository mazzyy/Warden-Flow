<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warden Flow — DevOps Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#080b12; --shell:#0b0f18; --panel:#0f1420; --panel2:#0c111b; --raise:#131a28;
    --line:#1a2231; --line2:#232d3e;
    --ink:#e9eef7; --sub:#8d9bb0; --dim:#5b6779; --faint:#3c4657;
    --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --ok:#34d399; --bad:#f87171;
    --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    --rail:268px; --top:64px;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  code{font-family:var(--mono)}

  /* ---------- shell ---------- */
  .app{height:100vh;display:grid;grid-template-rows:var(--top) 1fr}
  .top{
    display:flex;align-items:center;gap:16px;padding:0 18px;
    background:var(--shell);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:9px;flex:none}
  .brand .mark{
    width:22px;height:22px;border-radius:6px;flex:none;align-self:center;
    background:linear-gradient(140deg,var(--teal),var(--indigo));
    box-shadow:0 0 0 1px rgba(45,212,191,.3);
  }
  .brand h1{font-size:15px;font-weight:750;letter-spacing:-.01em}
  .brand .t{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase}

  .runbar{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:820px;margin-left:8px}
  .runbar input[type=text]{
    flex:1;min-width:0;background:#060a11;border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:8px 11px;font-family:var(--mono);font-size:12.5px;
  }
  .runbar input[type=text]:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.10)}
  .tg{
    display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);
    padding:7px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;white-space:nowrap;
    background:var(--panel2);user-select:none;
  }
  .tg:hover{border-color:var(--faint)}
  .tg input{accent-color:var(--teal);cursor:pointer}
  .tg.on{color:var(--ink);border-color:rgba(45,212,191,.45);background:rgba(45,212,191,.07)}
  button.run{
    background:linear-gradient(180deg,#38e2ce,#15b0a0);color:#03211d;border:none;border-radius:8px;
    padding:9px 18px;font-weight:750;font-size:13px;cursor:pointer;white-space:nowrap;transition:.14s;
  }
  button.run:hover{filter:brightness(1.08)}
  button.run:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .topmeta{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
  .topmeta .m{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  .topmeta .m b{color:var(--sub);font-weight:600}
  .topmeta a.inc{font-size:12px;color:var(--sub);border:1px solid var(--line2);padding:6px 10px;border-radius:8px}
  .topmeta a.inc:hover{color:var(--ink);border-color:var(--faint);text-decoration:none}

  /* ---------- body: rail + stage ---------- */
  .body{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0}
  .rail{
    background:var(--shell);border-right:1px solid var(--line);
    padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  }
  .railhd{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
    font-weight:750;padding:2px 8px 8px}

  .item{
    display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;
    padding:9px 9px;border-radius:9px;cursor:default;border:1px solid transparent;transition:.15s;
  }
  .item.clickable{cursor:pointer}
  .item.clickable:hover{background:var(--panel)}
  .item.sel{background:var(--raise);border-color:var(--line2)}
  .item .dot{
    width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint);
    margin-top:1px;flex:none;transition:.2s;background:var(--panel2);
  }
  .item>div:last-child{min-width:0}
  .item .nm{font-size:13px;font-weight:650;color:var(--dim);transition:.2s}
  .item .sm{font-size:11.5px;color:var(--faint);margin-top:1px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.run .dot{border-color:var(--teal);color:var(--teal);border-right-color:transparent;
    animation:spin .8s linear infinite}
  .item.run .nm{color:var(--ink)}
  .item.run .sm{color:var(--teal)}
  .item.ok .dot{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.13);color:var(--ok)}
  .item.ok .nm{color:var(--ink)}
  .item.ok .sm{color:var(--sub)}
  .item.bad .dot{border-color:var(--bad);background:rgba(248,113,113,.12);color:var(--bad)}
  .item.bad .nm,.item.bad .sm{color:var(--bad)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .item.summary{margin-bottom:6px;border-color:var(--line2);background:var(--panel2)}
  .item.summary .dot{border-radius:6px}
  .item.summary .nm{color:var(--sub)}
  .item.summary.sel .nm,.item.summary.live .nm{color:var(--ink)}
  .item.summary.live .dot{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.13);color:var(--ok)}
  .item.summary.live .sm{color:var(--sub)}
  .rail .sep{height:1px;background:var(--line);margin:8px 6px}
  .railfoot{margin-top:auto;padding:12px 9px 2px;display:flex;flex-direction:column;gap:7px}
  .stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
  .stat .v{font-family:var(--mono);font-size:12px;color:var(--sub)}

  /* ---------- stage ---------- */
  .stage{min-width:0;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
  .crumb{
    display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);
    background:var(--panel2);min-height:49px;
  }
  .crumb .ttl{font-size:13.5px;font-weight:700}
  .crumb .desc{font-size:12px;color:var(--dim)}
  .crumb .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line2);
    border-radius:6px;padding:3px 8px;background:var(--panel)}
  .pane{overflow-y:auto;padding:22px;scroll-behavior:smooth}
  .pane>*+*{margin-top:16px}

  /* ---------- pane pieces ---------- */
  .kv{font-size:13px;color:var(--sub)} .kv b{color:var(--ink);font-weight:650}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .cell .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .cell .v{font-size:14px;font-weight:650;font-family:var(--mono);margin-top:3px;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:rgba(52,211,153,.09);color:var(--ok);border:1px solid rgba(52,211,153,.22);
    border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
  .tag.n{background:rgba(129,140,248,.10);color:var(--indigo);border-color:rgba(129,140,248,.25);
    border-radius:6px;font-family:var(--mono)}
  .tag.w{background:rgba(251,191,36,.09);color:var(--amber);border-color:rgba(251,191,36,.25)}
  .fchips{display:flex;flex-wrap:wrap;gap:5px}
  .fchip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;
    font-family:var(--mono);font-size:11px;color:var(--sub)}

  /* code viewer */
  .code{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#050810}
  .code .bar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .code .bar .fn{font-family:var(--mono);font-size:11.5px;color:var(--sub)}
  .code .bar .lang{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .code .bar .cp{margin-left:auto;font-size:11px;color:var(--dim);background:none;border:1px solid var(--line2);
    border-radius:6px;padding:3px 9px;cursor:pointer;font-family:inherit}
  .code .bar .cp:hover{color:var(--ink);border-color:var(--faint)}
  .code pre{margin:0;padding:12px 0;overflow:auto;max-height:min(58vh,620px);
    font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#c4d0e0}
  .code .ln{display:block;white-space:pre;padding-right:14px}
  .code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:34px;
    margin-right:14px;color:#2f3949;text-align:right;user-select:none}
  .code pre{counter-reset:ln}

  /* verdict + banners */
  .verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--line2);background:var(--panel)}
  .verdict .g{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:800;flex:none}
  .verdict.pass .g{background:rgba(52,211,153,.14);color:var(--ok)}
  .verdict.pass{border-color:rgba(52,211,153,.3)}
  .verdict.fail .g{background:rgba(248,113,113,.14);color:var(--bad)}
  .verdict.fail{border-color:rgba(248,113,113,.32)}
  .verdict .h{font-size:14.5px;font-weight:750}
  .verdict .s{font-size:12.5px;color:var(--sub)}
  .checkline{display:flex;gap:9px;font-size:12.5px;color:var(--sub);padding:5px 2px;
    border-bottom:1px solid var(--line);align-items:flex-start}
  .checkline:last-child{border-bottom:none}
  .checkline .m{color:var(--ok);flex:none;font-weight:700}
  .checkline.bad .m{color:var(--bad)} .checkline.bad{color:#e7a9a9}

  .cta{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#38e2ce,#15b0a0);
    color:#03211d;border-radius:9px;padding:11px 17px;font-weight:750;font-size:13.5px}
  .cta:hover{filter:brightness(1.07);text-decoration:none}
  .note{font-size:12.5px;color:var(--amber);display:flex;gap:8px}
  .err{font-size:12.5px;color:var(--bad);font-family:var(--mono);background:rgba(248,113,113,.06);
    border:1px solid rgba(248,113,113,.22);border-radius:9px;padding:11px 13px;white-space:pre-wrap}

  .deployhero{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--line2);background:var(--panel);flex-wrap:wrap}
  .deployhero .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);flex:none}
  .deployhero .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
  .deployhero .t{flex:1;min-width:180px}
  .deployhero .h{font-size:14.5px;font-weight:750;color:var(--ink)}
  .deployhero .s{font-size:12.5px;color:var(--sub);font-family:var(--mono);word-break:break-all}

  /* ---------- empty state: the pipeline, drawn ---------- */
  .hero .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal);margin-bottom:10px}
  .hero h2{font-size:clamp(24px,3.1vw,34px);font-weight:750;letter-spacing:-.022em;line-height:1.12;
    margin-bottom:10px;max-width:20ch;text-wrap:balance}
  .hero p{color:var(--sub);font-size:14.5px;max-width:62ch}
  .hero p b{color:var(--ink);font-weight:650}

  .flow{width:100%;height:auto;max-width:1160px;display:block;margin-top:4px;overflow:visible}
  .fl-conn{stroke:var(--line2);stroke-width:1.5}
  .fl-arrow{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .fl-type{fill:var(--faint);font-family:var(--mono);font-size:9.5px;text-anchor:middle;
    letter-spacing:.04em}
  .fl-lb{fill:var(--ink);font-size:12px;font-weight:650;text-anchor:middle}
  .fl-sub{fill:var(--dim);font-size:10.5px;text-anchor:middle;font-family:var(--mono)}
  .fl-idx{fill:var(--teal);font-family:var(--mono);font-size:11px;text-anchor:middle;opacity:.85}
  .fl-glyph{fill:var(--indigo);font-family:var(--mono);font-size:15px;text-anchor:middle}

  .fl-n rect,.fl-n circle{fill:var(--panel);stroke:var(--line2);stroke-width:1.5}
  .fl-agent rect{stroke:var(--teal);fill:rgba(45,212,191,.07)}
  .fl-src rect{stroke:var(--indigo);fill:rgba(129,140,248,.07)}
  .fl-human circle{stroke:var(--amber);fill:rgba(251,191,36,.08)}
  .fl-live circle{stroke:var(--ok);fill:rgba(52,211,153,.08)}
  .fl-person circle,.fl-person path{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-linecap:round}
  .fl-globe circle,.fl-globe path{fill:none;stroke:var(--ok);stroke-width:1.4}

  .fl-band{fill:rgba(45,212,191,.035);stroke:rgba(45,212,191,.16);stroke-width:1;
    stroke-dasharray:3 4}
  .fl-band-lb{fill:var(--teal);font-family:var(--mono);font-size:9.5px;text-anchor:middle;
    letter-spacing:.09em;text-transform:uppercase;opacity:.8}
  .fl-cut{stroke:var(--amber);stroke-width:1;stroke-dasharray:2 5;opacity:.5}
  .fl-cut-lb{fill:var(--amber);font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;opacity:.75}

  /* a typed object travelling the wire, and each node waking as it arrives */
  .fl-pulse{stroke:var(--teal);stroke-width:2.5;stroke-linecap:round;
    stroke-dasharray:16 400;stroke-dashoffset:16;opacity:0;
    animation:travel 3.4s var(--d) cubic-bezier(.5,0,.5,1) infinite}
  @keyframes travel{
    0%,4%{stroke-dashoffset:16;opacity:0}
    8%{opacity:.95}
    38%{stroke-dashoffset:-150;opacity:.95}
    46%,100%{stroke-dashoffset:-150;opacity:0}
  }
  .fl-n rect,.fl-n circle{animation:wake 3.4s var(--d) ease-in-out infinite}
  @keyframes wake{
    0%,6%{filter:none}
    16%{filter:drop-shadow(0 0 7px rgba(45,212,191,.55))}
    34%,100%{filter:none}
  }
  .fl-human circle{animation-name:wakeAmber}
  @keyframes wakeAmber{
    0%,6%{filter:none}
    16%{filter:drop-shadow(0 0 8px rgba(251,191,36,.6))}
    34%,100%{filter:none}
  }
  .fl-live circle{animation-name:wakeOk}
  @keyframes wakeOk{
    0%,6%{filter:none}
    16%{filter:drop-shadow(0 0 8px rgba(52,211,153,.6))}
    34%,100%{filter:none}
  }

  /* ---------- claims ---------- */
  .claims{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .claim{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .claim .n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--teal);line-height:1;
    font-variant-numeric:tabular-nums}
  .claim .l{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:7px}
  .claim .d{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}

  /* ---------- collapsed setup ---------- */
  .setup{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
  .setup>summary{cursor:pointer;padding:13px 16px;font-size:13px;font-weight:650;color:var(--sub);
    list-style:none;display:flex;align-items:center;gap:9px;user-select:none}
  .setup>summary::-webkit-details-marker{display:none}
  .setup>summary::before{content:"▸";color:var(--faint);font-size:11px;transition:.18s}
  .setup[open]>summary::before{transform:rotate(90deg)}
  .setup>summary:hover{color:var(--ink)}
  .setup>summary:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
  .setup .two{padding:0 14px 14px}

  .alsoline{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--dim);
    padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
  .alsoline .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex:none;margin-top:7px;
    box-shadow:0 0 0 3px rgba(129,140,248,.14)}

  @media(prefers-reduced-motion:reduce){
    .fl-pulse{animation:none;opacity:.5;stroke-dashoffset:-150}
    .fl-n rect,.fl-n circle{animation:none}
  }

  /* artifact tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    font:inherit;font-size:12.5px;font-weight:650;padding:8px 12px;cursor:pointer;margin-bottom:-1px;
    font-family:var(--mono)}
  .tabs button:hover{color:var(--sub)}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}

  /* welcome / empty state */
  .hero{max-width:760px}
  .hero h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-bottom:8px}
  .hero p{color:var(--sub);font-size:14px}
  .flowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);
    font-size:11.5px;color:var(--dim);margin-top:6px}
  .flowline span.s{border:1px solid var(--line2);border-radius:6px;padding:4px 9px;background:var(--panel);color:var(--sub)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:1080px){.two{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
  .box h3{font-size:13px;font-weight:750;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .box h3 .n{width:19px;height:19px;border-radius:6px;background:rgba(129,140,248,.16);color:var(--indigo);
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .box p{font-size:12.5px;color:var(--sub);margin-bottom:8px}
  .box pre{background:#050810;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
    font-family:var(--mono);font-size:11px;color:#c4d0e0;overflow-x:auto}
  .muted{color:var(--dim);font-size:12px}

  /* running placeholder */
  .waiting{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:13.5px}
  .waiting .o{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);
    border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}

  @media(max-width:900px){
    :root{--rail:100%}
    .app{grid-template-rows:auto 1fr}
    .top{flex-wrap:wrap;padding:10px 14px;gap:10px;height:auto}
    .brand{width:100%}
    .runbar{margin-left:0;order:3;width:100%;flex-wrap:wrap}
    .runbar input[type=text]{flex:1 1 100%;min-width:0}
    .topmeta{order:2;margin-left:auto}
    .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);
      padding:10px;align-items:center}
    .railhd,.railfoot,.rail .sep,.item .sm{display:none}
    .item{grid-template-columns:20px auto;padding:7px 10px;flex:none}
    .runbar{max-width:none}
    .topmeta .m{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <h1>Warden Flow</h1>
      <span class="t">DevOps Studio</span>
    </div>

    <div class="runbar">
      <input type="text" id="target" spellcheck="false" value="examples/checkout-svc"
             placeholder="https://github.com/you/your-repo  ·  or a local path" />
      <label class="tg" id="tgLive"><input type="checkbox" id="live" /> live model</label>
      <label class="tg" id="tgPr"><input type="checkbox" id="openpr" /> open PR</label>
      <button class="run" id="runbtn">Run workflow</button>
    </div>

    <div class="topmeta">
      <div class="m" id="mTokens"><b>—</b> tok</div>
      <div class="m" id="mTime"><b>00:00</b></div>
      <a class="inc" href="/incidents">Incident dashboard</a>
    </div>
  </header>

  <div class="body">
    <aside class="rail" id="rail"></aside>
    <section class="stage">
      <div class="crumb">
        <div>
          <div class="ttl" id="crumbTitle">Delivery</div>
          <div class="desc" id="crumbDesc">Point Warden Flow at a repository and run the workflow.</div>
        </div>
        <div class="right" id="crumbRight"></div>
      </div>
      <div class="pane" id="pane"></div>
    </section>
  </div>

</div>

<script>
/* ------------------------------------------------------------------ */
/* Node definitions — these mirror the SSE `stage` keys exactly.        */
/* ------------------------------------------------------------------ */
const NODES = [
  {key:"clone",            label:"Clone",       desc:"Fetch the repository and list its files."},
  {key:"assess",           label:"Assess",      desc:"Read the code: language, entrypoint, ports, dependencies."},
  {key:"containerize",     label:"Containerize",desc:"Write a production Dockerfile from the assessed profile."},
  {key:"pipeline",         label:"Pipeline",    desc:"Write CI/CD: build, test, scan, push, deploy."},
  {key:"deploy_plan",      label:"Deploy plan", desc:"Write deploy manifests, rollout strategy and rollback."},
  {key:"verify_artifacts", label:"Verify",      desc:"Gate every generated artifact before a human sees it."},
  {key:"pr",               label:"Pull request",desc:"The human review boundary — the only write primitive."},
  {key:"deployed",         label:"Live site",   desc:"Where this ships once the pull request is merged."},
];
const NODE = Object.fromEntries(NODES.map(n=>[n.key,n]));

/* ------------------------------------------------------------------ */
const $  = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const numfmt = n => n>=1000 ? (n/1000).toFixed(1)+"k" : String(n||0);

const state = {
  phase:"idle",            // idle | running | done | error
  view:"summary",          // "summary" | node key
  follow:true,             // auto-advance the pane to the active node
  started:0, timer:null,
  tokens:0,
  node:{},                 // key -> {status, thinking, tokens, model, error}
  out:{},                  // key -> structured output
  clone:null, pr:null, deploy:null, runId:null,
  artifact:0,              // selected artifact tab on the summary view
};

/* ---------------- rail ---------------- */
function summaryLine(key){
  const o = state.out[key], n = state.node[key] || {};
  if(n.status==="run")  return n.thinking || "working…";
  if(n.status==="bad")  return n.error || "failed";
  if(n.status!=="ok")   return NODE[key].desc;
  switch(key){
    case "clone":        return (state.clone?.fileCount ?? 0) + " files resolved";
    case "assess":       return [o?.language,o?.framework].filter(Boolean).join(" · ") || "profiled";
    case "containerize": return o?.base_image || "Dockerfile written";
    case "pipeline":     return (o?.stages||[]).join(" → ") || "workflow written";
    case "deploy_plan":  return (o?.manifests||[]).length + " manifests · " + (o?.strategy||"");
    case "verify_artifacts": return o?.passed ? "passed — safe to review" : "failed the gate";
    case "pr":           return state.pr?.pr_url ? "opened" : (state.pr ? "pushed" : "skipped");
    case "deployed":     return state.deploy?.live ? "serving now" : (state.deploy?.detail || "target set");
  }
  return "done";
}

function renderRail(){
  const r = $("rail");
  const done = NODES.filter(n=>state.node[n.key]?.status==="ok").length;
  const glyph = k => {
    const s = state.node[k]?.status;
    if(s==="ok")  return "✓";
    if(s==="bad") return "!";
    if(s==="run") return "";
    return "";
  };
  const cls = k => {
    const s = state.node[k]?.status;
    return s==="ok"?"ok":s==="bad"?"bad":s==="run"?"run":"";
  };
  const clickable = k => state.node[k]?.status ? " clickable" : "";

  r.innerHTML =
    `<div class="railhd">Run</div>` +
    `<div class="item summary clickable${state.view==="summary"?" sel":""}${state.phase==="done"?" live":""}" data-view="summary">
       <div class="dot">${state.phase==="done"?"✓":"◆"}</div>
       <div><div class="nm">Delivery summary</div>
       <div class="sm">${esc(state.phase==="idle"?"not started":state.phase==="running"?done+" of "+NODES.length+" nodes":state.phase==="done"?"complete — artifacts ready":"stopped")}</div></div>
     </div>` +
    `<div class="sep"></div><div class="railhd">Nodes</div>` +
    NODES.map(n=>`
      <div class="item ${cls(n.key)}${clickable(n.key)}${state.view===n.key?" sel":""}" data-view="${n.key}">
        <div class="dot">${glyph(n.key)}</div>
        <div><div class="nm">${esc(n.label)}</div><div class="sm">${esc(summaryLine(n.key))}</div></div>
      </div>`).join("") +
    `<div class="railfoot">
       <div class="stat"><span class="l">nodes</span><span class="v">${done}/${NODES.length}</span></div>
       <div class="stat"><span class="l">tokens</span><span class="v">${numfmt(state.tokens)}</span></div>
       <div class="stat"><span class="l">model</span><span class="v">${esc($("live").checked?"live":"scripted")}</span></div>
     </div>`;

  r.querySelectorAll(".item.clickable").forEach(el=>{
    el.onclick = () => { state.follow=false; select(el.dataset.view); };
  });
}

/* ---------------- pane ---------------- */
function select(view){
  state.view = view;
  const isSum = view==="summary";
  $("crumbTitle").textContent = isSum ? "Delivery summary" : NODE[view].label;
  $("crumbDesc").textContent  = isSum
    ? (state.phase==="idle" ? "Point Warden Flow at a repository and run the workflow."
      : state.phase==="running" ? "Running — each node hands a typed object to the next."
      : "Every artifact the workflow produced, in one place.")
    : NODE[view].desc;

  const n = state.node[view] || {};
  $("crumbRight").innerHTML = (!isSum && n.status==="ok")
    ? `<span class="chip">${numfmt(n.tokens||0)} tok</span><span class="chip">${esc(n.model||"")}</span>`
    : "";

  $("pane").innerHTML = isSum ? viewSummary() : viewNode(view);
  $("pane").scrollTop = 0;
  wireCopy();
  renderRail();
}

function codeBlock(fn, lang, content){
  const id = "c"+Math.random().toString(36).slice(2,9);
  const lines = esc(content||"").split("\n").map(l=>`<span class="ln">${l||" "}</span>`).join("");
  return `<div class="code">
    <div class="bar"><span class="fn">${esc(fn)}</span><span class="lang">${esc(lang)}</span>
      <button class="cp" data-copy="${id}">copy</button></div>
    <pre id="${id}">${lines}</pre></div>`;
}
function wireCopy(){
  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick = () => {
      const pre = $(b.dataset.copy); if(!pre) return;
      navigator.clipboard?.writeText(pre.innerText).then(()=>{
        b.textContent="copied"; setTimeout(()=>b.textContent="copy",1400);
      }).catch(()=>{});
    };
  });
}

/* --- per-node views --- */
function viewNode(key){
  const n = state.node[key] || {}, o = state.out[key] || {};
  if(n.status==="bad") return `<div class="err">${esc(n.error||"failed")}</div>`;
  if(n.status!=="ok")  return `<div class="waiting"><span class="o"></span>${esc(n.thinking||"Waiting to run.")}</div>`;

  if(key==="clone"){
    const c = state.clone || {};
    return `<div class="kv"><b>${c.fileCount||0}</b> files ${c.remote?"cloned from GitHub":"read from disk"}</div>
      <div class="fchips">${(c.files||[]).map(f=>`<span class="fchip">${esc(f)}</span>`).join("")}</div>`;
  }
  if(key==="assess"){
    const cell=(l,v)=>`<div class="cell"><div class="l">${l}</div><div class="v">${esc(v??"—")}</div></div>`;
    return `<div class="grid">
        ${cell("language",o.language)}${cell("framework",o.framework)}
        ${cell("entrypoint",o.entrypoint)}${cell("ports",(o.ports||[]).join(", "))}
        ${cell("build system",o.build_system)}
        ${cell("dependencies",(o.dependencies||[]).length||"—")}
      </div>
      ${o.notes?`<div class="kv">${esc(o.notes)}</div>`:""}`;
  }
  if(key==="containerize"){
    return `<div class="grid">
        <div class="cell"><div class="l">base image</div><div class="v">${esc(o.base_image)}</div></div>
        <div class="cell"><div class="l">multi-stage</div><div class="v">${o.multistage?"yes":"no"}</div></div>
        <div class="cell"><div class="l">non-root</div><div class="v">${o.runs_as_nonroot?"yes":"no"}</div></div>
      </div>
      <div class="tags">${(o.security_notes||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>
      ${codeBlock("Dockerfile","dockerfile",o.content)}`;
  }
  if(key==="pipeline"){
    return `<div class="tags">${(o.stages||[]).map(s=>`<span class="tag n">${esc(s)}</span>`).join("")}</div>
      ${codeBlock(".github/workflows/deliver.yml","yaml",o.content)}`;
  }
  if(key==="deploy_plan"){
    return `<div class="grid">
        <div class="cell"><div class="l">strategy</div><div class="v">${esc(o.strategy)}</div></div>
        <div class="cell"><div class="l">manifests</div><div class="v">${(o.manifests||[]).length}</div></div>
      </div>
      ${o.rollback?`<div class="kv"><b>Rollback:</b> ${esc(o.rollback)}</div>`:""}
      ${(o.manifests||[]).map(m=>codeBlock(m.path,"yaml",m.content)).join("")}`;
  }
  if(key==="verify_artifacts"){
    const pass = !!o.passed;
    return `<div class="verdict ${pass?"pass":"fail"}">
        <div class="g">${pass?"✓":"✕"}</div>
        <div><div class="h">${pass?"Passed — safe to hand to a reviewer":"Failed the gate"}</div>
        <div class="s">${(o.checks||[]).length} checks · ${(o.issues||[]).length} issues</div></div></div>
      <div>${(o.checks||[]).map(c=>`<div class="checkline"><span class="m">✓</span><span>${esc(c)}</span></div>`).join("")}
      ${(o.issues||[]).map(i=>`<div class="checkline bad"><span class="m">✕</span><span>${esc(i)}</span></div>`).join("")}</div>
      <div class="muted">These are static checks on the generated text. They do not execute the pipeline.</div>`;
  }
  if(key==="pr") return prBlock();
  if(key==="deployed") return deployBlock();
  return "";
}

function deployBlock(){
  const d = state.deploy;
  if(!d || !d.url) return `<div class="muted">No deploy target configured. Set <code>DEPLOY_URL</code> in <code>.env</code> to end the run on a clickable site.</div>`;
  const live = !!d.live;
  return `<div class="verdict ${live?"pass":"fail"}">
      <div class="g">${live?"●":"○"}</div>
      <div><div class="h">${live?"Serving now":"Not serving yet"}</div>
      <div class="s">${esc(d.detail||"")}</div></div></div>
    <a class="cta" href="${esc(d.url)}" target="_blank" rel="noopener">Open the deployed site ↗</a>
    <div class="kv"><b>${esc(d.url)}</b></div>
    ${live ? "" : `<div class="note"><span>→</span><span>This is the target the generated pipeline deploys to. It goes live when the pull request is merged and the deploy job runs.</span></div>`}`;
}

function prBlock(){
  const pr = state.pr;
  if(!pr) return `<div class="muted">No pull request was requested for this run.</div>`;
  if(pr.pr_url){
    let h = `<a class="cta" href="${esc(pr.pr_url)}" target="_blank" rel="noopener">Review the pull request →</a>
      <div class="kv">${esc(pr.pr_url)}</div>`;
    if((pr.skipped||[]).length)
      h += `<div class="note"><span>⚠</span><span>Skipped ${pr.skipped.map(s=>esc(s.path)).join(", ")} — the token needs the <b>Workflows</b> permission to include the CI file.</span></div>`;
    return h;
  }
  if(pr.compare_url){
    return `<a class="cta" href="${esc(pr.compare_url)}" target="_blank" rel="noopener">Open the pull request →</a>
      <div class="kv">Files pushed to <b>${esc(pr.branch)}</b>.</div>
      <div class="note"><span>⚠</span><span>Add <b>Pull requests: write</b> to the token and Warden Flow will open it for you.</span></div>`;
  }
  return `<div class="err">${esc(pr.detail||pr.error||"Could not open a pull request.")}</div>`;
}

/* --- summary view --- */
function artifacts(){
  const a = [];
  if(state.out.containerize?.content) a.push({name:"Dockerfile",lang:"dockerfile",body:state.out.containerize.content});
  if(state.out.pipeline?.content)     a.push({name:".github/workflows/deliver.yml",lang:"yaml",body:state.out.pipeline.content});
  (state.out.deploy_plan?.manifests||[]).forEach(m=>a.push({name:m.path,lang:"yaml",body:m.content}));
  return a;
}

function viewSummary(){
  if(state.phase==="idle") return viewWelcome();

  const arts = artifacts();
  const v = state.out.verify_artifacts;
  const done = NODES.filter(n=>state.node[n.key]?.status==="ok").length;
  const secs = state.started ? Math.round((Date.now()-state.started)/1000) : 0;

  let h = "";

  if(state.phase==="running"){
    const active = NODES.find(n=>state.node[n.key]?.status==="run");
    h += `<div class="waiting"><span class="o"></span>${esc(active ? (NODE[active.key].label+" — "+(state.node[active.key].thinking||"working…")) : "Starting…")}</div>`;
  } else if(v){
    const pass = !!v.passed;
    h += `<div class="verdict ${pass?"pass":"fail"}">
      <div class="g">${pass?"✓":"✕"}</div>
      <div><div class="h">${pass?"Artifacts validated — ready for human review":"The gate rejected these artifacts"}</div>
      <div class="s">${done} nodes · ${numfmt(state.tokens)} tokens · ${secs}s · ${(v.issues||[]).length} open issue${(v.issues||[]).length===1?"":"s"}</div></div></div>`;
  }

  if(state.phase==="done" && state.deploy?.url){
    const live = !!state.deploy.live;
    h += `<div class="deployhero">
        <div class="dot ${live?"on":""}"></div>
        <div class="t"><div class="h">${live?"Live now":"Deploy target"}</div>
          <div class="s">${esc(state.deploy.url)} · ${esc(state.deploy.detail||"")}</div></div>
        <a class="cta" href="${esc(state.deploy.url)}" target="_blank" rel="noopener">Open the site ↗</a>
      </div>`;
  }
  if(state.phase==="done" && state.pr) h += prBlock();

  if(arts.length){
    const i = Math.min(state.artifact, arts.length-1);
    h += `<div class="tabs" id="artTabs">` +
      arts.map((a,idx)=>`<button class="${idx===i?"on":""}" data-art="${idx}">${esc(a.name.split("/").pop())}</button>`).join("") +
      `</div>` + codeBlock(arts[i].name, arts[i].lang, arts[i].body);
  } else if(state.phase!=="running"){
    h += `<div class="muted">No artifacts were produced.</div>`;
  }

  if(state.phase==="done"){
    h += `<div class="muted">Run <code>${esc($("live").checked?"warden bench-deliver --live":"make bench-deliver")}</code> to score this workflow against a single prompt on the same service.</div>`;
  }
  return h;
}

/* ------------------------------------------------------------------ */
/* Empty state. This is the first thing anyone sees — a judge, a demo   */
/* viewer — so it shows the mechanism rather than describing it. The    */
/* diagram is the thesis: single-purpose nodes, a typed object on every */
/* handoff, and exactly one place a human stands.                       */
/* ------------------------------------------------------------------ */

const HERO = [
  { t:"repo",         sub:"your service",  kind:"src",   out:"source"       },
  { t:"assess",       sub:"reads the code",kind:"agent", out:"RepoProfile"  },
  { t:"containerize", sub:"the image",     kind:"agent", out:"Dockerfile"   },
  { t:"pipeline",     sub:"CI/CD",         kind:"agent", out:"Pipeline"     },
  { t:"deploy plan",  sub:"manifests",     kind:"agent", out:"DeployPlan"   },
  { t:"verify",       sub:"the gate",      kind:"agent", out:"VerifyReport" },
  { t:"human review", sub:"a pull request",kind:"human", out:"merge"        },
  { t:"live",         sub:"deployed",      kind:"live",  out:""             },
];

const GLYPH = { src:"❯", agent:"", human:"", live:"" };

function heroFlow(){
  const W = 1160, H = 224, R = 23, CY = 84;
  const x = i => 62 + i * ((W - 124) / (HERO.length - 1));

  let conn = "", pulse = "", nodes = "";

  HERO.forEach((n, i) => {
    const cx = x(i);

    if(i < HERO.length - 1){
      const nx = x(i + 1);
      conn += `<line x1="${cx + R + 7}" y1="${CY}" x2="${nx - R - 7}" y2="${CY}"
                     class="fl-conn" />`;
      // the typed object this node hands to the next one — the whole argument,
      // written on the wire where it actually travels
      conn += `<text x="${(cx + nx) / 2}" y="${CY - 15}" class="fl-type">${n.out}</text>`;
      conn += `<path d="M${nx - R - 12} ${CY - 4} L${nx - R - 7} ${CY} L${nx - R - 12} ${CY + 4}"
                     class="fl-arrow" />`;
      pulse += `<line x1="${cx + R + 7}" y1="${CY}" x2="${nx - R - 7}" y2="${CY}"
                      class="fl-pulse" style="--d:${i * 0.42}s" />`;
    }

    const shape = n.kind === "human" || n.kind === "live"
      ? `<circle cx="${cx}" cy="${CY}" r="${R}" />`
      : `<rect x="${cx - R}" y="${CY - R}" width="${R * 2}" height="${R * 2}" rx="9" />`;

    nodes += `<g class="fl-n fl-${n.kind}" style="--d:${i * 0.42}s">
        ${shape}
        ${n.kind === "src" ? `<text x="${cx}" y="${CY + 6}" class="fl-glyph">${GLYPH.src}</text>` : ""}
        ${n.kind === "agent" ? `<text x="${cx}" y="${CY + 5}" class="fl-idx">${i}</text>` : ""}
        ${n.kind === "human" ? `<g class="fl-person" transform="translate(${cx},${CY})">
            <circle cx="0" cy="-6" r="5.5" />
            <path d="M-9 9 a9 9 0 0 1 18 0" />
          </g>` : ""}
        ${n.kind === "live" ? `<g class="fl-globe" transform="translate(${cx},${CY})">
            <circle cx="0" cy="0" r="10.5" />
            <path d="M-10.5 0 H10.5 M0 -10.5 a14 14 0 0 1 0 21 a14 14 0 0 1 0 -21" />
          </g>` : ""}
        <text x="${cx}" y="${CY + R + 26}" class="fl-lb">${n.t}</text>
        <text x="${cx}" y="${CY + R + 42}" class="fl-sub">${n.sub}</text>
      </g>`;
  });

  // the boundary: everything left of it is the fleet, everything right is people
  // 0.66 of the way, not the midpoint — the midpoint is exactly where the
  // VerifyReport type label sits, and the two collided.
  const bx = x(5) + 0.66 * (x(6) - x(5));
  const band = `<rect x="${x(1) - R - 14}" y="${CY - R - 22}" width="${x(5) - x(1) + R * 2 + 28}"
      height="${R * 2 + 44}" rx="14" class="fl-band" />
    <text x="${(x(1) + x(5)) / 2}" y="${CY - R - 30}" class="fl-band-lb">five agents · one job each</text>
    <line x1="${bx}" y1="${CY - R - 26}" x2="${bx}" y2="${CY + R + 62}" class="fl-cut" />
    <text x="${bx + 8}" y="${CY + R + 60}" class="fl-cut-lb">people from here</text>`;

  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Pipeline: repo, then five agent nodes — assess, containerize, pipeline, deploy plan, verify — then human review as a pull request, then the live deployment.">
    ${band}${conn}${pulse}${nodes}
  </svg>`;
}

function viewWelcome(){
  return `
  <div class="hero">
    <div class="eyebrow">Warden Flow · DELIVER</div>
    <h2>Your repository goes in. Reviewed DevOps comes out.</h2>
    <p>Five single-purpose agents, each returning a <b>typed object</b> the next one reads.
       No mega-prompt makes every infrastructure decision, and the only thing the fleet can
       write is a pull request.</p>
  </div>

  ${heroFlow()}

  <div class="claims">
    <div class="claim"><div class="n">5</div><div class="l">agents, one job each</div>
      <div class="d">Assess, containerize, pipeline, deploy-plan, verify — separate prompts, separate budgets.</div></div>
    <div class="claim"><div class="n">1</div><div class="l">way to write anything</div>
      <div class="d">A pull request. No agent holds cluster or registry credentials.</div></div>
    <div class="claim"><div class="n">100%</div><div class="l">of calls audited</div>
      <div class="d">Every tool call is policy-checked, budget-capped and written to the trail.</div></div>
  </div>

  <details class="setup">
    <summary>Setup — repo, model, pull requests</summary>
    <div class="two">
      <div class="box"><h3><span class="n">1</span>Point it at a repo</h3>
        <p>Paste a GitHub URL above, or keep the bundled sample to watch the whole workflow run offline for free.</p>
        <pre>examples/checkout-svc</pre></div>
      <div class="box"><h3><span class="n">2</span>Run it live</h3>
        <p>Tick <b>live model</b>. Configure a provider in <code>.env</code> — Gemini and Vertex directly, Azure OpenAI, OpenAI and Anthropic through LiteLLM.</p>
        <pre>DELIVER_MODEL=azure/gpt-5.6-sol</pre></div>
      <div class="box"><h3><span class="n">3</span>Get a pull request</h3>
        <p>Tick <b>open PR</b> to push the generated DevOps back for review. Needs Contents, Workflows and Pull requests write.</p>
        <pre>GITHUB_TOKEN=github_pat_…</pre></div>
      <div class="box"><h3><span class="n">4</span>End on a live site</h3>
        <p>Merging runs the generated pipeline — build, test, scan, push, deploy the exact commit image.</p>
        <pre>DEPLOY_URL=https://your-site.com</pre></div>
    </div>
  </details>

  <div class="alsoline">
    <span class="dot"></span>
    <span>Warden Flow also runs <a href="/incidents">OPERATE</a> — the reactive fleet that triages a
      production alert, diagnoses root cause, and proposes a GitOps fix through this same governed spine.</span>
  </div>`;
}

/* ---------------- event handling ---------------- */
function setNode(key, patch){
  state.node[key] = Object.assign({}, state.node[key], patch);
}

function handle(ev){
  const k = ev.stage;

  if(k==="error"){ fail(ev.error); return; }

  if(k==="complete"){
    state.phase="done"; state.runId=ev.id;
    state.tokens = ev.totalTokens ?? state.tokens;
    if(ev.pr) state.pr = ev.pr;
    stopTimer();
    select("summary");
    return;
  }

  if(!NODE[k]) return;

  if(ev.status==="start"){
    setNode(k,{status:"run", thinking:ev.thinking||""});
    if(state.follow) select(k); else renderRail();
    if(state.view==="summary"){ $("pane").innerHTML = viewSummary(); wireCopy(); }
  }
  else if(ev.status==="done"){
    setNode(k,{status:"ok", tokens:ev.tokens||0, model:ev.model||""});
    if(k==="clone")           state.clone = ev;
    else if(k==="pr")         state.pr = ev.pr;
    else if(k==="deployed")   state.deploy = {url:ev.url, live:ev.live, detail:ev.detail, httpStatus:ev.httpStatus};
    else                      state.out[k] = ev.output || {};
    state.tokens += (ev.tokens||0);
    $("mTokens").innerHTML = `<b>${numfmt(state.tokens)}</b> tok`;
    if(state.view===k || state.follow) select(k); else renderRail();
  }
  else if(ev.status==="error"){
    setNode(k,{status:"bad", error:ev.error||"failed"});
    state.phase="error"; stopTimer();
    select(k);
  }
}

function fail(msg){
  state.phase="error"; stopTimer();
  $("pane").innerHTML = `<div class="err">${esc(msg||"The run failed.")}</div>`;
  $("crumbTitle").textContent="Run failed";
  $("crumbDesc").textContent="Nothing was written to your repository.";
  renderRail();
}

/* ---------------- timer ---------------- */
function startTimer(){
  state.started = Date.now();
  stopTimer();
  state.timer = setInterval(()=>{
    const s = Math.floor((Date.now()-state.started)/1000);
    $("mTime").innerHTML = `<b>${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}</b>`;
  }, 500);
}
function stopTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }

/* ---------------- run ---------------- */
async function run(){
  const btn = $("runbtn");
  const target = $("target").value.trim() || "examples/checkout-svc";
  const live = $("live").checked, pr = $("openpr").checked;

  Object.assign(state,{phase:"running",view:"summary",follow:true,tokens:0,
    node:{},out:{},clone:null,pr:null,deploy:null,runId:null,artifact:0});
  btn.disabled = true;
  $("mTokens").innerHTML = "<b>0</b> tok";
  startTimer();
  select("summary");

  try{
    const resp = await fetch("/api/deliver/stream",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target,live,pr})
    });
    if(!resp.ok || !resp.body) throw new Error("HTTP "+resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {value,done} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0,i); buf = buf.slice(i+2);
        if(chunk.startsWith("data:")){
          try{ handle(JSON.parse(chunk.slice(5).trim())); }catch(e){}
        }
      }
    }
    if(state.phase==="running"){ state.phase="done"; stopTimer(); select("summary"); }
  }catch(e){
    fail(e.message + " — is the dashboard server still running?");
  }finally{
    btn.disabled = false;
  }
}

/* ---------------- wiring ---------------- */
$("runbtn").onclick = run;
$("target").addEventListener("keydown", e => { if(e.key==="Enter") run(); });
["live","openpr"].forEach(id=>{
  const cb = $(id), wrap = cb.closest(".tg");
  const sync = () => { wrap.classList.toggle("on", cb.checked); renderRail(); };
  cb.addEventListener("change", sync); sync();
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-art]");
  if(t){ state.artifact = +t.dataset.art; $("pane").innerHTML = viewSummary(); wireCopy(); }
});

select("summary");
</script>
</body>
</html>
