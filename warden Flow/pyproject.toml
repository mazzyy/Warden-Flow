[project]
name = "warden"
version = "0.1.0"
description = "An AI DevOps engineer — a multi-node LLM workflow that ships and operates services"
requires-python = ">=3.11"

[project.scripts]
# Run from inside any repo: `warden-deliver --live` reads the current directory.
warden-deliver = "warden.deliver:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
