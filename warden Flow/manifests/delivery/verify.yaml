apiVersion: warden.dev/v1
kind: Agent
metadata:
  name: verify_artifacts
  description: >-
    Last gate before human review. Validates the generated Dockerfile, pipeline
    and manifests against a production checklist and reports pass/issues. Holds no
    tools and changes nothing.
spec:
  model: gemini-3.5-flash
  tools: []
  scopes: []
  blastRadius:
    namespace: demo
    maxFilesPerPatch: 0
    maxChangedLines: 0
  budget:
    maxTokensPerRun: 40000
    maxToolCalls: 0
  approval: auto
  circuitBreaker:
    failuresBeforeOpen: 3
    cooldownSeconds: 600
